<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AOTR — Gold Farm Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #080b12;
  --surface: #0f1320;
  --surface2: #151a2e;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.14);
  --text: #e2e8f8;
  --muted: #5a6285;
  --g1: #7c3aed;
  --g2: #2563eb;
  --g3: #06b6d4;
  --gold: #fbbf24;
  --green: #34d399;
  --red: #f87171;
  --display: 'Outfit', sans-serif;
  --mono: 'JetBrains Mono', monospace;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--display);
  min-height: 100vh;
  padding: 2.5rem 1.5rem 5rem;
  overflow-x: hidden;
}

/* Ambient glow blobs */
body::before {
  content: '';
  position: fixed;
  width: 600px; height: 600px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(124,58,237,0.18) 0%, transparent 70%);
  top: -150px; left: -150px;
  pointer-events: none;
  z-index: 0;
}

body::after {
  content: '';
  position: fixed;
  width: 500px; height: 500px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(6,182,212,0.14) 0%, transparent 70%);
  bottom: -100px; right: -100px;
  pointer-events: none;
  z-index: 0;
}

.wrapper {
  max-width: 860px;
  margin: 0 auto;
  position: relative;
  z-index: 1;
}

/* ── HEADER ── */
header {
  margin-bottom: 2.5rem;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 1rem;
}

.logo-tag {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  background: linear-gradient(90deg, var(--g1), var(--g3));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 6px;
}

h1 {
  font-size: 40px;
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1;
  background: linear-gradient(135deg, #fff 0%, #a5b4fc 50%, var(--g3) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

/* ── SUMMARY ── */
.summary {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-bottom: 2rem;
}

.metric {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 1rem 1.25rem;
  position: relative;
  overflow: hidden;
}

.metric::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 14px;
  padding: 1px;
  background: linear-gradient(135deg, rgba(124,58,237,0.5), rgba(6,182,212,0.3), transparent);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
}

.metric-label {
  font-family: var(--mono);
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 8px;
}

.metric-value {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.02em;
  background: linear-gradient(135deg, #fff, #c4b5fd);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

/* ── TOOLBAR ── */
.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1rem;
  flex-wrap: wrap;
  gap: 8px;
}

.toolbar-label {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
}

.btn-add {
  font-family: var(--display);
  font-size: 13px;
  font-weight: 600;
  padding: 9px 20px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  background: linear-gradient(135deg, var(--g1), var(--g2));
  color: #fff;
  transition: opacity 0.15s, transform 0.12s;
  letter-spacing: 0.01em;
}

.btn-add:hover { opacity: 0.88; transform: translateY(-1px); }
.btn-add:active { transform: scale(0.97); }

/* ── CARDS ── */
.accounts { display: flex; flex-direction: column; gap: 10px; }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 1.25rem 1.5rem;
  position: relative;
  overflow: hidden;
  transition: border-color 0.2s, transform 0.15s;
  animation: cardIn 0.25s ease both;
}

@keyframes cardIn {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}

.card:hover { border-color: var(--border2); transform: translateY(-1px); }

/* gradient left accent */
.card::before {
  content: '';
  position: absolute;
  left: 0; top: 16px; bottom: 16px;
  width: 3px;
  border-radius: 0 3px 3px 0;
  background: linear-gradient(180deg, var(--g1), var(--g3));
}

.card-top {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 14px;
}

.avatar {
  width: 40px; height: 40px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 600;
  flex-shrink: 0;
}

.pseudo-input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  font-family: var(--display);
  font-size: 15px;
  font-weight: 700;
  color: #fff;
  border-bottom: 1px solid transparent;
  padding: 2px 0;
  transition: border-color 0.15s;
}

.pseudo-input::placeholder { color: var(--muted); font-weight: 400; }
.pseudo-input:focus { border-bottom-color: rgba(124,58,237,0.6); }

.btn-del {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--muted);
  font-size: 16px;
  padding: 5px 7px;
  border-radius: 8px;
  transition: color 0.15s, background 0.15s;
  line-height: 1;
}

.btn-del:hover { color: var(--red); background: rgba(248,113,113,0.12); }

.card-fields {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 10px;
  margin-bottom: 14px;
}

.field { display: flex; flex-direction: column; gap: 5px; }

.field label {
  font-family: var(--mono);
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  color: var(--muted);
}

.field select,
.field input[type=number] {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 7px 10px;
  font-family: var(--mono);
  font-size: 13px;
  color: var(--text);
  width: 100%;
  outline: none;
  transition: border-color 0.15s;
  -moz-appearance: textfield;
}

.field select:focus,
.field input[type=number]:focus { border-color: rgba(124,58,237,0.55); }
.field input[type=number]::-webkit-outer-spin-button,
.field input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }

/* ── RESULT ── */
.result {
  border-top: 1px solid var(--border);
  padding-top: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.result-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.result-cap {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--muted);
}

.result-remaining {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 600;
}

.result-remaining.done { color: var(--green); }
.result-remaining.todo { color: var(--gold); }

.progress-wrap {
  height: 5px;
  background: rgba(255,255,255,0.07);
  border-radius: 99px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  border-radius: 99px;
  background: linear-gradient(90deg, var(--g1), var(--g2), var(--g3));
  transition: width 0.4s ease;
}

.progress-fill.done {
  background: linear-gradient(90deg, #059669, var(--green));
}

/* ── CAPS ── */
.caps-section { margin-top: 3rem; }

.section-divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 1rem;
}

.section-divider::before,
.section-divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border2);
}

.section-divider span {
  font-family: var(--mono);
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
  white-space: nowrap;
}

.caps-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
}

.cap-item {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 0.75rem 1rem;
}

.cap-label {
  font-family: var(--mono);
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 5px;
}

.cap-val {
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 600;
  background: linear-gradient(90deg, var(--g1), var(--g3));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

/* ── EMPTY ── */
.empty {
  text-align: center;
  padding: 4rem 2rem;
  border: 1px dashed var(--border2);
  border-radius: 16px;
  color: var(--muted);
  font-family: var(--mono);
  font-size: 13px;
}

/* ── RESPONSIVE ── */
@media (max-width: 580px) {
  h1 { font-size: 28px; }
  .summary { grid-template-columns: repeat(2, 1fr); }
  .card-fields { grid-template-columns: 1fr; }
  .caps-grid { grid-template-columns: repeat(3, 1fr); }
}
</style>
</head>
<body>
<div class="wrapper">

  <header>
    <div>
      <div class="logo-tag">Attack on Titan: Revolution</div>
      <h1>Gold Farm Tracker</h1>
    </div>
  </header>

  <div class="summary" id="summaryRow"></div>

  <div class="toolbar">
    <span class="toolbar-label" id="accountCount">0 accounts</span>
    <button class="btn-add" onclick="addAccount()">+ Add Account</button>
  </div>

  <div class="accounts" id="accountsGrid"></div>

  <div class="caps-section">
    <div class="section-divider"><span>Prestige Gold Caps</span></div>
    <div class="caps-grid">
      <div class="cap-item"><div class="cap-label">P0 → P1</div><div class="cap-val">200 M</div></div>
      <div class="cap-item"><div class="cap-label">P1 → P2</div><div class="cap-val">400 M</div></div>
      <div class="cap-item"><div class="cap-label">P2 → P3</div><div class="cap-val">600 M</div></div>
      <div class="cap-item"><div class="cap-label">P3 → P4</div><div class="cap-val">800 M</div></div>
      <div class="cap-item"><div class="cap-label">P4 → P5</div><div class="cap-val">1,000 M</div></div>
    </div>
  </div>

</div>
<script>
const CAPS = [200e6, 400e6, 600e6, 800e6, 1e9];

const AV_COLORS = [
  { bg: 'rgba(124,58,237,0.2)', color: '#a78bfa' },
  { bg: 'rgba(6,182,212,0.18)', color: '#67e8f9' },
  { bg: 'rgba(251,191,36,0.18)', color: '#fbbf24' },
  { bg: 'rgba(52,211,153,0.18)', color: '#34d399' },
  { bg: 'rgba(248,113,113,0.18)', color: '#f87171' },
  { bg: 'rgba(99,102,241,0.2)', color: '#818cf8' },
];

let accounts = [];
let nextId = 1;
let syncMode = false; // true = reading from data.json (bot mode)

const ACCOUNT_ORDER = [
  "AUT_Inventory67","EmperorDebbie","DebbieEmperor",
  "EmperorDebbie1","SobloxRexFan","DebbieEmperor2"
];

async function fetchFromJson() {
  try {
    const res = await fetch('https://aotr-farm-tracker-production.up.railway.app/data?t=' + Date.now());
    if (!res.ok) return false;
    const data = await res.json();
    // data is { AccountName: { gold, prestige }, ... }
    const keys = Object.keys(data);
    if (!keys.length) return false;

    // Merge bot data into accounts list
    const existingPseudos = accounts.map(a => a.pseudo);
    keys.forEach(pseudo => {
      const { gold, prestige, gems } = data[pseudo];
      const existing = accounts.find(a => a.pseudo === pseudo);
      if (existing) {
        existing.gold = gold;
        existing.prestige = prestige;
        existing.gems = gems || 0;
      } else {
        accounts.push({ id: nextId++, pseudo, prestige, gold, gems: gems || 0 });
      }
    });
    // Sort by ACCOUNT_ORDER
    accounts.sort((a, b) => {
      const ia = ACCOUNT_ORDER.indexOf(a.pseudo);
      const ib = ACCOUNT_ORDER.indexOf(b.pseudo);
      return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib);
    });

    syncMode = true;
    return true;
  } catch(e) {
    return false;
  }
}

function load() {
  try {
    const s = localStorage.getItem('aotr_v3');
    if (s) { const p = JSON.parse(s); if (Array.isArray(p) && p.length) { accounts = p; nextId = Math.max(...p.map(a => a.id)) + 1; } }
  } catch(e) {}
}

function save() {
  try { localStorage.setItem('aotr_v3', JSON.stringify(accounts)); } catch(e) {}
}

function updateSyncBadge() {
  const badge = document.getElementById('syncBadge');
  if (!badge) return;
  if (syncMode) {
    badge.textContent = '🤖 Bot sync — ' + new Date().toLocaleTimeString('en');
    badge.style.color = '#34d399';
  } else {
    badge.textContent = '✏️ Manual mode';
    badge.style.color = '#5a6285';
  }
}

// Auto-refresh from data.json every 10 seconds
async function autoSync() {
  const ok = await fetchFromJson();
  if (ok) { render(); updateSyncBadge(); }
  setTimeout(autoSync, 10000);
}

function fmt(n) {
  if (n >= 1e9) return (n/1e9).toFixed(2) + ' B';
  if (n >= 1e6) return Math.round(n/1e6) + ' M';
  return n.toLocaleString('en');
}

function getCap(p) { return CAPS[p] ?? null; }

function initials(pseudo) {
  if (!pseudo || !pseudo.trim()) return '??';
  const parts = pseudo.replace(/[_\-]/g,' ').trim().split(/\s+/);
  return parts.length >= 2 ? (parts[0][0]+parts[1][0]).toUpperCase() : pseudo.slice(0,2).toUpperCase();
}

function renderSummary() {
  const total = accounts.length;
  const ready = accounts.filter(a => { const c = getCap(a.prestige); return c === null || a.gold >= c; }).length;
  const totalGold = accounts.reduce((s,a) => s + (parseFloat(a.gold)||0), 0);
  const totalLeft = accounts.reduce((s,a) => { const c = getCap(a.prestige); return s + (c ? Math.max(0, c-(parseFloat(a.gold)||0)) : 0); }, 0);
  const totalGems = accounts.reduce((s,a) => s + (parseFloat(a.gems)||0), 0);
  document.getElementById('accountCount').textContent = `${total} account${total!==1?'s':''}`;
  document.getElementById('summaryRow').innerHTML = `
    <div class="metric"><div class="metric-label">Accounts</div><div class="metric-value">${total}</div></div>
    <div class="metric"><div class="metric-label">Ready to Prestige</div><div class="metric-value">${ready} / ${total}</div></div>
    <div class="metric"><div class="metric-label">Total Gold</div><div class="metric-value">${fmt(totalGold)}</div></div>
    <div class="metric"><div class="metric-label">💎 Total Gems</div><div class="metric-value">${fmt(totalGems)}</div></div>
    <div class="metric"><div class="metric-label">Still to Farm</div><div class="metric-value">${fmt(totalLeft)}</div></div>
  `;
}

function updateCardResult(card, acc) {
  const gold = parseFloat(acc.gold) || 0;
  const cap = getCap(acc.prestige);
  const remaining = cap !== null ? Math.max(0, cap - gold) : 0;
  const pct = cap !== null ? Math.min(100, Math.round((gold/cap)*100)) : 100;
  const done = cap === null || gold >= cap;
  card.querySelector('.progress-fill').style.width = pct + '%';
  card.querySelector('.progress-fill').className = 'progress-fill' + (done ? ' done' : '');
  card.querySelector('.result-cap').textContent = cap !== null ? `Cap P${acc.prestige}→P${acc.prestige+1}: ${fmt(cap)} · ${pct}% done` : 'Max prestige';
  const rem = card.querySelector('.result-remaining');
  rem.textContent = done ? '✓ Ready to prestige!' : fmt(remaining)+' left';
  rem.className = 'result-remaining ' + (done ? 'done' : 'todo');
}

function createCard(acc, idx) {
  const gold = parseFloat(acc.gold) || 0;
  const gems = parseFloat(acc.gems) || 0;
  const cap = getCap(acc.prestige);
  const remaining = cap !== null ? Math.max(0, cap - gold) : 0;
  const pct = cap !== null ? Math.min(100, Math.round((gold/cap)*100)) : 100;
  const done = cap === null || gold >= cap;
  const av = AV_COLORS[idx % AV_COLORS.length];

  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.id = acc.id;
  card.innerHTML = `
    <div class="card-top">
      <div class="avatar" style="background:${av.bg};color:${av.color};">${initials(acc.pseudo)}</div>
      <input class="pseudo-input" type="text" value="${acc.pseudo.replace(/"/g,'&quot;')}" placeholder="Account username" />
      <button class="btn-del" title="Remove">✕</button>
    </div>
    <div class="card-fields">
      <div class="field">
        <label>Current Prestige</label>
        <select>
          ${[0,1,2,3,4,5].map(p=>`<option value="${p}" ${p===acc.prestige?'selected':''}>Prestige ${p}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>Current Gold</label>
        <input type="number" class="gold-inp" value="${Math.round(gold)}" step="1000000" min="0" placeholder="0" />
      </div>
      <div class="field">
        <label>💎 Gems</label>
        <input type="number" class="gems-inp" value="${Math.round(gems)}" step="1000" min="0" placeholder="0" readonly style="opacity:0.6;cursor:default;" />
      </div>
    </div>
    <div class="result">
      <div class="progress-wrap"><div class="progress-fill ${done?'done':''}" style="width:${pct}%"></div></div>
      <div class="result-meta">
        <span class="result-cap">${cap !== null ? `Cap P${acc.prestige}→P${acc.prestige+1}: ${fmt(cap)} · ${pct}% done` : 'Max prestige'}</span>
        <span class="result-remaining ${done?'done':'todo'}">${done ? '✓ Ready to prestige!' : fmt(remaining)+' left'}</span>
      </div>
    </div>
  `;

  card.querySelector('.pseudo-input').addEventListener('input', e => {
    acc.pseudo = e.target.value;
    card.querySelector('.avatar').textContent = initials(acc.pseudo);
    save(); renderSummary();
  });
  card.querySelector('select').addEventListener('change', e => {
    acc.prestige = parseInt(e.target.value);
    save(); updateCardResult(card, acc); renderSummary();
  });
  card.querySelector('input[type=number]').addEventListener('input', e => {
    acc.gold = parseFloat(e.target.value)||0;
    save(); updateCardResult(card, acc); renderSummary();
  });
  card.querySelector('.btn-del').addEventListener('click', () => {
    accounts = accounts.filter(a => a.id !== acc.id);
    save(); render();
  });

  return card;
}

function renderAccounts() {
  const grid = document.getElementById('accountsGrid');
  if (!accounts.length) {
    grid.innerHTML = '<div class="empty">No accounts yet — click "+ Add Account" to get started.</div>';
    return;
  }

  // Keep existing cards, only add/remove as needed
  const existingIds = [...grid.querySelectorAll('.card')].map(c => parseInt(c.dataset.id));
  const accountIds = accounts.map(a => a.id);

  // Remove cards that no longer exist
  existingIds.forEach(id => {
    if (!accountIds.includes(id)) {
      const el = grid.querySelector(`.card[data-id="${id}"]`);
      if (el) el.remove();
    }
  });

  // Remove empty state if present
  const empty = grid.querySelector('.empty');
  if (empty) empty.remove();

  // Add new cards
  accounts.forEach((acc, idx) => {
    if (!grid.querySelector(`.card[data-id="${acc.id}"]`)) {
      grid.appendChild(createCard(acc, idx));
    }
  });
}

function render() { renderSummary(); renderAccounts(); }

function addAccount() {
  accounts.push({ id: nextId++, pseudo: '', prestige: 0, gold: 0 });
  save(); render();
  setTimeout(() => {
    const cards = document.querySelectorAll('.card');
    if (cards.length) { const last = cards[cards.length-1]; last.scrollIntoView({behavior:'smooth',block:'center'}); last.querySelector('.pseudo-input').focus(); }
  }, 40);
}

load(); render();
autoSync();
</script>

<div style="text-align:center;margin-top:3rem;padding-bottom:1rem;display:flex;flex-direction:column;align-items:center;gap:10px;">
  <span id="syncBadge" style="font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;letter-spacing:0.08em;color:#5a6285;">✏️ Manual mode</span>
  <span style="font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:500;letter-spacing:0.1em;background:linear-gradient(90deg,#7c3aed,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;opacity:0.6;">Made by @Cat.</span>
